<svg xmlns="http://www.w3.org/2000/svg" width="880" height="359" viewBox="0 0 880 359" role="img" aria-label="Pantry R35 overview (printed page 1)">
  <rect x="8" y="8" width="864" height="343" rx="6" fill="#fbfaf6" stroke="#46625b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d3733" font-weight="bold">Pantry R35 — sanitized source excerpt</text>
  <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#33524b">Pantry R35 overview (printed page 1)</text>
  <text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b6f6a">Text-only card: no address, parcel or permit identity and no raw source links. Quotations keep the printed wording.</text>
  <text x="40" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 1</text>
  <text x="50" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">READY: survey and loose practice only · house construction conditional</text>
  <text x="40" y="164" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 1</text>
  <text x="50" y="182" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">One top plate per wall remains the concept. Exact site connections still require the checks printed</text>
  <text x="50" y="201" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">beside their steps.</text>
  <text x="40" y="229" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 1</text>
  <text x="50" y="247" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Next physical action: mark W1 at about 68 in as a trial from the existing finished wall, then locate the</text>
  <text x="50" y="266" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">actual roof-truss bottom chord and record the cabinet boxes separately. No house cuts or slab holes</text>
  <text x="50" y="285" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">follow from the drawing alone.</text>
  <text x="40" y="329" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">Source family: r35-p01-overview.svg · printed page 1 of the R35 conditional plan (29 pages).</text>
</svg>
