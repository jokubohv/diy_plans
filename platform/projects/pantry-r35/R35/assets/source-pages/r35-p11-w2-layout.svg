<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Mark W2's 2×8 frame (printed page 11)">
  <rect x="8" y="8" width="864" height="454" rx="6" fill="#fbfaf6" stroke="#46625b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d3733" font-weight="bold">Pantry R35 — sanitized source excerpt</text>
  <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#33524b">Mark W2's 2×8 frame (printed page 11)</text>
  <text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b6f6a">Text-only card: no address, parcel or permit identity and no raw source links. Quotations keep the printed wording.</text>
  <text x="40" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 11</text>
  <text x="50" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">W2 is finished 8⅜ in thick to match the existing column and ends at the column front; it does not pass</text>
  <text x="50" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">through the column.</text>
  <text x="40" y="183" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 11</text>
  <text x="50" y="201" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">½ in pantry gypsum / 7¼ in actual dry 2×8 core / ⅝ in room-side gypsum — ½ + 7¼ + ⅝ = 8⅜ in finished W2</text>
  <text x="50" y="220" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">thickness</text>
  <text x="40" y="248" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 11</text>
  <text x="50" y="266" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Candidate plate length 53-53⅛ in; actual column contact governs</text>
  <text x="40" y="294" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 11</text>
  <text x="50" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">02. The current comparison is 53 in using A3's 11-in projection, or 53⅛ in using the user's 10⅞-in</text>
  <text x="50" y="331" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">projection. Mark the first four candidate stud centers ¾, 16, 32 and 48 in only if they fit the accepted</text>
  <text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">end/detail; field-fit the last member against the true column end.</text>
  <text x="40" y="378" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 11</text>
  <text x="50" y="396" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">HOUSE CUT HELD: actual column surface and W2 connection detail</text>
  <text x="40" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">Source family: r35-p11-w2-layout.svg · printed page 11 of the R35 conditional plan (29 pages).</text>
</svg>
