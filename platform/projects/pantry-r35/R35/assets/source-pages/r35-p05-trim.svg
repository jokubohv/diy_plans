<svg xmlns="http://www.w3.org/2000/svg" width="880" height="454" viewBox="0 0 880 454" role="img" aria-label="Remove only required baseboard (printed page 5)">
  <rect x="8" y="8" width="864" height="438" rx="6" fill="#fbfaf6" stroke="#46625b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d3733" font-weight="bold">Pantry R35 — sanitized source excerpt</text>
  <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#33524b">Remove only required baseboard (printed page 5)</text>
  <text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b6f6a">Text-only card: no address, parcel or permit identity and no raw source links. Quotations keep the printed wording.</text>
  <text x="40" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 5</text>
  <text x="50" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Existing trim at wall tie-ins and the new closet passage is included before framing and later replaced</text>
  <text x="50" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">at exposed finished faces.</text>
  <text x="40" y="183" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 5</text>
  <text x="50" y="201" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">TR-01: if a baseboarded existing surface receives W1's left end, mark and remove only trim that blocks</text>
  <text x="50" y="220" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">its full-height connection and finish tie-in.</text>
  <text x="50" y="239" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">TR-02: at the existing column, remove only wrapped baseboard/shoe obstructing the W2 contact. W2 stops</text>
  <text x="50" y="258" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">at the column front.</text>
  <text x="50" y="277" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">TR-03: at EX1, remove trim on both accessible faces only within the approved passage and jamb/return</text>
  <text x="50" y="296" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">finish limits. Keep the existing kitchen-side pantry door, jamb and casing.</text>
  <text x="40" y="324" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 5</text>
  <text x="50" y="342" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Do not remove an entire room's baseboard by default. EX1 trim work beyond survey waits for the opening</text>
  <text x="50" y="361" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">location, wall role and service/structural plan. New baseboard is measured after drywall and cabinet</text>
  <text x="50" y="380" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">fit.</text>
  <text x="40" y="424" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">Source family: r35-p05-trim.svg · printed page 5 of the R35 conditional plan (29 pages).</text>
</svg>
