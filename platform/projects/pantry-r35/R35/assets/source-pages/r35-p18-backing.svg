<svg xmlns="http://www.w3.org/2000/svg" width="880" height="489" viewBox="0 0 880 489" role="img" aria-label="Add 2×6 cabinet backing (printed page 18)">
  <rect x="8" y="8" width="864" height="473" rx="6" fill="#fbfaf6" stroke="#46625b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d3733" font-weight="bold">Pantry R35 — sanitized source excerpt</text>
  <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#33524b">Add 2×6 cabinet backing (printed page 18)</text>
  <text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b6f6a">Text-only card: no address, parcel or permit identity and no raw source links. Quotations keep the printed wording.</text>
  <text x="40" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 18</text>
  <text x="50" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">HOLD: actual cabinet rails and block-to-stud/wall load path</text>
  <text x="40" y="164" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 18</text>
  <text x="50" y="182" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">The owner selected 2×6 instead of the approved plan's 2×4 backing. These 25 pieces are between W1 studs,</text>
  <text x="50" y="201" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">laid flat.</text>
  <text x="40" y="229" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 18</text>
  <text x="50" y="247" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Short S10-S11 clear bay: 3¼ in; all bay blocks are field-fit</text>
  <text x="40" y="275" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 18</text>
  <text x="50" y="293" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">01. Transfer actual U1/U2/U3 and base cabinet mounting holes/rails to W1. Move the pictured 5½-in-high</text>
  <text x="50" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">bands if their real fastener rows differ.</text>
  <text x="50" y="331" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">02. Measure each stud bay separately. Trial-cut one dry 2×6 block, put its 5½-in face vertical and</text>
  <text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">pantry-facing flush to the W1 studs, and check the 1½-in depth stays inside the cavity.</text>
  <text x="40" y="378" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 18</text>
  <text x="50" y="396" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Nominal mix: 20×14½ + 2×13¾ + 3×3¼ = 327¼ in. Four 8-ft boards pack on paper; one extra is a field-fit</text>
  <text x="50" y="415" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">allowance. These are not batch cuts. Shelf brackets use verified full studs and their chosen hardware.</text>
  <text x="40" y="459" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">Source family: r35-p18-backing.svg · printed page 18 of the R35 conditional plan (29 pages).</text>
</svg>
