<svg xmlns="http://www.w3.org/2000/svg" width="880" height="478" viewBox="0 0 880 478" role="img" aria-label="Read the finished plan (printed page 2)">
  <rect x="8" y="8" width="864" height="462" rx="6" fill="#fbfaf6" stroke="#46625b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d3733" font-weight="bold">Pantry R35 — sanitized source excerpt</text>
  <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#33524b">Read the finished plan (printed page 2)</text>
  <text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b6f6a">Text-only card: no address, parcel or permit identity and no raw source links. Quotations keep the printed wording.</text>
  <text x="40" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">W1 clear inside: 149 in after drywall; cabinet/fridge chain totals 149 in</text>
  <text x="40" y="164" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="182" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">W1 outside depth: About 68 in trial from existing finished EX1 wall; 2 in less than original 70</text>
  <text x="40" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">Clear pantry depth: About 63½ in if W1 finishes 4½ in thick</text>
  <text x="40" y="256" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="274" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">W2 return: 8⅜ in finished thick; stops at existing column front</text>
  <text x="40" y="302" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="320" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">The A7 drawing's candidate truss center is about 65⅞ in from an assumed existing finished face; W1's</text>
  <text x="50" y="339" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">proposed top-plate center at a 68-in outer face is about 65¾ in. This is a layout target, not an</text>
  <text x="50" y="358" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">as-built connection.</text>
  <text x="40" y="386" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">printed page 2</text>
  <text x="50" y="404" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#243b37">CONCEPT: verify reference faces and the physical truss</text>
  <text x="40" y="448" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7b8c87">Source family: r35-p02-plan.svg · printed page 2 of the R35 conditional plan (29 pages).</text>
</svg>
