<svg xmlns="http://www.w3.org/2000/svg" width="5764" height="2602" viewBox="0 0 5764 2602" role="img" aria-label="Pantry R35 concept plan">
  <rect x="0" y="0" width="5764" height="2602" fill="#f7faf7"/>
  <text x="40" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#173a35">Pantry R35 — conditional concept</text>
  <text x="40" y="80" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#48625c">In-place framing; only survey and loose-scrap practice are ready. House cuts, drilling and fixture loading are held.</text>
  <g stroke="#1d3a35" fill="none">
    <rect x="327.17875000000004" y="150" width="5374.9575" height="154.305" fill="#b9cfc4"/>
    <rect x="40" y="150" width="287.17875000000004" height="2331.7200000000003" fill="#d9e4de"/>
    <rect x="40" y="2108.8162500000003" width="287.17875000000004" height="372.90375000000006" fill="#cfd8d2"/>
    <rect x="40" y="2481.7200000000003" width="5743.5675" height="10" fill="#e8e2d4"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#33524b">
    <text x="4351.9675" y="2521.7200000000003">garage / refrigerator end</text>
    <text x="386.57875" y="2541.7200000000003">108-in base row · 37-in refrigerator bay at far end</text>
    <text x="387.17875000000004" y="132">W1 candidate plate 156.75 in · finished inside 149 in</text>
    <text x="58" y="178">W2 8.375 in finished · foyer side</text>
    <text x="58" y="2475.7200000000003">column (reported)</text>
    <text x="40" y="2573.7200000000003">68-in trial to the finished EX1 wall · 63½-in clear depth (conditional arithmetic)</text>
    <text x="40" y="2593.7200000000003" fill="#7b8c87">Schematic only — written dimensions govern; member heights are field-fit and not shown.</text>
  </g>
  <text x="40" y="2621.7200000000003" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7b8c87">Sources: sanitized R35 excerpt cards; identity withheld.</text>
</svg>
